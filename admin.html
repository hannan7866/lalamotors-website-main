<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Lala Motors</title>
  <link rel="icon" type="image/x-icon" href="images/logoo neww.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .form-section {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #333;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .upload-btn {
      background: var(--primary-blue, #0066cc);
      color: white;
      padding: 1rem 2rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    .upload-btn:hover {
      background: var(--primary-blue-dark, #0052a3);
    }

    .status-indicator {
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .status-in-stock {
      background: #e6f4ea;
      color: #1e7e34;
    }

    .status-out-of-stock {
      background: #fbe9e7;
      color: #d32f2f;
    }

    .file-upload {
      border: 2px dashed #ddd;
      padding: 1.5rem;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .file-upload:hover {
      border-color: var(--primary-blue, #0066cc);
    }

    .file-upload input[type="file"] {
      display: none;
    }

    .file-upload-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .file-upload-icon {
      font-size: 2rem;
      color: #666;
    }

    .file-name {
      margin-top: 0.5rem;
      font-size: 0.875rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <header class="admin-header">
      <h1>Admin Panel - LALA MOTORS</h1>
      <div class="admin-user-info">
        <span>lalamotors1@gmail.com</span>
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </header>
    <div class="auth-message">
      ✓ Authenticated as admin
    </div>
    <main class="admin-main">
      <div class="form-section">
        <h2>Add Pre-Owned Bike</h2>
        <form id="addBikeForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="bikeBrand">Brand</label>
              <input type="text" id="bikeBrand" name="brand" required>
            </div>
            <div class="form-group">
              <label for="bikeModel">Model</label>
              <input type="text" id="bikeModel" name="model" required>
            </div>
            <div class="form-group">
              <label for="bikeYear">Year</label>
              <input type="number" id="bikeYear" name="year" required>
            </div>
            <div class="form-group">
              <label for="bikePrice">Price</label>
              <input type="number" id="bikePrice" name="price" required>
            </div>
            <div class="form-group full-width">
              <label for="bikeDescription">Description</label>
              <textarea id="bikeDescription" name="description"></textarea>
            </div>
            <div class="form-group full-width">
              <label for="bikeImage">Bike Image</label>
              <div class="file-upload">
                <label class="file-upload-label">
                  <span class="file-upload-icon">📁</span>
                  <span>Click to upload image</span>
                  <input type="file" id="bikeImage" name="image" accept="image/*">
                  <div class="file-name"></div>
                </label>
              </div>
            </div>
            <div class="form-group full-width">
              <button type="submit" class="upload-btn">Upload Bike</button>
            </div>
          </div>
        </form>
      </div>

      <div class="form-section">
        <h2>Add Spare Part</h2>
        <form id="autoPartForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="partBrand">Brand</label>
              <select id="partBrand" name="brand" required>
                <option value="">Select Brand</option>
              </select>
            </div>
            <div class="form-group">
              <label for="partModel">Model</label>
              <select id="partModel" name="model" required>
                <option value="">Select Model</option>
              </select>
            </div>
            <div class="form-group">
              <label for="partCategory">Category</label>
              <select id="partCategory" name="category" required>
                <option value="">Select Category</option>
              </select>
            </div>
            <div class="form-group">
              <label for="partName">Part Name</label>
              <select id="partName" name="name" required>
                <option value="">Select Part</option>
              </select>
            </div>
            <div class="form-group">
              <label for="partPrice">Price (₹)</label>
              <input type="number" id="partPrice" name="price" min="0" step="0.01" required>
            </div>
            <div class="form-group">
              <label for="partQuantity">Quantity</label>
              <input type="number" id="partQuantity" name="quantity" min="0" required>
            </div>
            <div class="form-group full-width">
              <label for="partImage">Part Image</label>
              <div class="file-upload">
                <label class="file-upload-label">
                  <span class="file-upload-icon">📁</span>
                  <span>Click to upload image</span>
                  <input type="file" id="partImage" name="image" accept="image/*">
                  <div class="file-name"></div>
                </label>
              </div>
            </div>
            <div class="form-group full-width">
              <button type="submit" class="upload-btn">Upload Part</button>
            </div>
          </div>
        </form>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="autoparts-data.js"></script>
  <script src="script.js"></script>
  <script>
    // Handle file upload UI
    document.querySelectorAll('input[type="file"]').forEach(input => {
      input.addEventListener('change', function() {
        const fileName = this.files[0]?.name;
        const fileNameDiv = this.parentElement.querySelector('.file-name');
        if (fileName) {
          fileNameDiv.textContent = fileName;
        } else {
          fileNameDiv.textContent = '';
        }
      });
    });
  </script>
</body>
</html>
