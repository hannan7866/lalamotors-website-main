<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | LALA MOTORS</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', Arial, sans-serif;
        }
        .modal-blur-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(8px);
            z-index: 1000;
        }
        .register-modal {
            max-width: 400px;
            margin: 40px auto;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            padding: 2.5rem 2rem 1.5rem 2rem;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 1001;
        }
        .register-modal .close-btn {
            position: absolute;
            top: 18px;
            right: 18px;
            background: none;
            border: none;
            font-size: 1.3rem;
            color: #333;
            cursor: pointer;
        }
        .register-modal .logo {
            display: block;
            margin: 0 auto 1.2rem auto;
            max-width: 160px;
        }
        .register-modal h2 {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
        }
        .register-modal .subtitle {
            text-align: center;
            color: #6b6b6b;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }
        .register-modal form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .register-modal input[type="text"],
        .register-modal input[type="email"],
        .register-modal input[type="password"],
        .register-modal input[type="tel"] {
            width: 100%;
            padding: 0.9rem 1rem;
            border-radius: 8px;
            border: 1.5px solid #e0e0e0;
            background: #fafbfc;
            font-size: 1rem;
            transition: border 0.2s;
        }
        .register-modal input:focus {
            outline: none;
            border-color: #b30000;
        }
        .register-modal .terms-row {
            display: flex;
            align-items: center;
            font-size: 0.97rem;
            margin: 0.5rem 0 0.5rem 0;
        }
        .register-modal .terms-row input[type="checkbox"] {
            margin-right: 0.5rem;
        }
        .register-modal .register-btn {
            width: 100%;
            background: #222;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.9rem 0;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .register-modal .register-btn:hover {
            background: #b30000;
        }
        .register-modal .divider {
            display: flex;
            align-items: center;
            margin: 2rem 0 1rem 0;
        }
        .register-modal .divider span {
            flex: 1;
            height: 1px;
            background: #eee;
        }
        .register-modal .divider p {
            margin: 0 1rem;
            color: #888;
            font-size: 0.95rem;
        }
        .register-modal .sign-in-btn {
            width: 100%;
            background: #fff;
            color: #222;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            padding: 0.9rem 0;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            cursor: pointer;
            transition: border 0.2s, background 0.2s;
        }
        .register-modal .sign-in-btn:hover {
            background: #f7f7f7;
            border-color: #b30000;
        }
        .register-modal .terms {
            text-align: center;
            color: #888;
            font-size: 0.93rem;
            margin-top: 0.5rem;
        }
        .register-modal .terms a {
            color: #b30000;
            text-decoration: underline;
        }
        @media (max-width: 500px) {
            .register-modal {
                width: 95vw;
                max-width: 95vw;
                min-width: unset;
                padding: 2rem 1.2rem 1.5rem 1.2rem;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
            }
            .register-modal .logo {
                max-width: 70vw;
            }
            .register-modal h2 {
                font-size: 1.5rem;
            }
            .register-modal .subtitle {
                font-size: 0.98rem;
            }
            .register-modal input[type="text"],
            .register-modal input[type="email"],
            .register-modal input[type="password"],
            .register-modal input[type="tel"] {
                font-size: 1.05rem;
                padding: 1rem 1.1rem;
            }
            .register-modal .register-btn,
            .register-modal .sign-in-btn {
                font-size: 1.08rem;
                padding: 1rem 0;
            }
        }
    </style>
</head>
<body>
    <div class="modal-blur-bg"></div>
    <div class="register-modal">
        <button class="close-btn" onclick="window.location.href='../services/login.html'" title="Close"><i class="fa-solid fa-xmark"></i></button>
        <img src="../images/logoo neww.png" alt="LALA MOTORS Logo" class="logo">
        <h2>Create an Account</h2>
        <div class="subtitle">Get started with LALA MOTORS</div>
        <form id="register-form">
            <input type="text" id="register-name" placeholder="Full Name" autocomplete="name" required>
            <input type="tel" id="register-phone" placeholder="Phone Number (Optional)" autocomplete="tel">
            <input type="email" id="register-email" placeholder="Email" autocomplete="email" required>
            <input type="password" id="register-password" placeholder="Password (min. 8 characters)" autocomplete="new-password" minlength="8" required>
            <input type="password" id="register-confirm-password" placeholder="Confirm Password" autocomplete="new-password" minlength="8" required>
            <div class="terms-row">
                <input type="checkbox" id="register-terms" required>
                <label for="register-terms">I agree to the <b>Terms & Privacy Policy</b>.</label>
            </div>
            <button type="submit" class="register-btn">Create Account</button>
        </form>
        <div id="register-error" style="color:red;text-align:center;margin:10px 0;"></div>
        <div class="divider"><span></span><p>Already have an account?</p><span></span></div>
        <button class="sign-in-btn" onclick="window.location.href='login.html'">Sign In</button>
        <div class="terms">
            By signing up, you agree to LALA MOTORS's <a href="#">Terms of Service</a> and acknowledge our <a href="#">Privacy Policy</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const authSupabaseUrl = 'https://fjhlglaivlbrowsuxres.supabase.co';
      const authSupabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqaGxnbGFpdmxicm93c3V4cmVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA1OTUwNDYsImV4cCI6MjA2NjE3MTA0Nn0.0p7afOyJ_Q67d0k7ZTQWnxYIJ6eseuNx_7yjupT6eWo';
      const authClient = window.supabase?.createClient
        ? window.supabase.createClient(authSupabaseUrl, authSupabaseKey)
        : null;
      const registerForm = document.getElementById('register-form');
      registerForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        const name = document.getElementById('register-name').value.trim();
        const phone = document.getElementById('register-phone').value.trim();
        const email = document.getElementById('register-email').value.trim().toLowerCase();
        const password = document.getElementById('register-password').value;
        const confirmPassword = document.getElementById('register-confirm-password').value;
        const termsChecked = document.getElementById('register-terms').checked;
        const errorDiv = document.getElementById('register-error');
        errorDiv.textContent = '';
        errorDiv.style.color = 'red';
        if (!termsChecked) {
          errorDiv.textContent = 'You must agree to the Terms & Privacy Policy.';
          return;
        }
        if (!name) {
          errorDiv.textContent = 'Please enter your full name.';
          return;
        }
        if (password !== confirmPassword) {
          errorDiv.textContent = 'Passwords do not match.';
          return;
        }
        const registerBtn = document.querySelector('.register-btn');
        registerBtn.disabled = true;
        registerBtn.textContent = 'Registering...';
        try {
          if (!authClient) {
            errorDiv.textContent = 'Auth client failed to initialize. Please refresh and try again.';
            return;
          }

          const { error } = await authClient.auth.signUp({
            email,
            password,
            options: { data: { name, phone } }
          });

          if (error) {
            errorDiv.textContent = error.message || 'Registration failed. Please try again.';
            return;
          }

          // Sign in immediately after successful signup for smoother UX.
          const { error: signInError } = await authClient.auth.signInWithPassword({ email, password });
          if (signInError) {
            errorDiv.style.color = 'green';
            errorDiv.textContent = 'Account created successfully. Please sign in now.';
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 1200);
            return;
          }

          errorDiv.style.color = 'green';
          errorDiv.textContent = 'Registration successful! Redirecting...';
          setTimeout(() => {
            window.location.href = '../index.html';
          }, 1000);
        } catch (err) {
          errorDiv.textContent = 'Network error while creating account. Please try again.';
        } finally {
          registerBtn.disabled = false;
          registerBtn.textContent = 'Create Account';
        }
      });
    </script>
</body>
</html>
